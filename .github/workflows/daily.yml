
name: Download Taiwan stock closing prices

on:
  workflow_dispatch:
  schedule:
    - cron: '30 10 * * 1-5'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Download closing prices
        run: python download.py --date 2026-10-08

      - name: Save downloaded data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update Taiwan stock closing prices"
            git push
          fi
  
